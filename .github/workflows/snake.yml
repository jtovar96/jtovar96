name: Serpiente de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F1552B&color_dots=#161b22,#2d2466,#4a36a8,#6C4BF5,#F1552B
            dist/snake-light.svg?color_snake=#F1552B&color_dots=#ebedf0,#d9d1ff,#a894ff,#6C4BF5,#F1552B
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
